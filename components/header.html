<!-- ===== LATAWA REAL ESTATE — shared header component =====
     Injected by components/loader.js on every page.
     Active nav link is set automatically based on window.location.
     NOTE: the preloader lives inline in each page's <body> (not here),
     because it must paint before the first async fetch resolves.
     ========================================================= -->
<nav class="navbar" id="navbar">
  <div class="nav-container">
    <a href="/" class="nav-logo">
      <img
        src="/images/latawa-logo.png"
        alt="LATAWA REAL ESTATE Logo"
        class="logo-svg"
      />
      <div class="logo-text">
        <span class="logo-name">LATAWA</span>
        <span class="logo-sub">REAL ESTATE</span>
      </div>
    </a>
    <ul class="nav-links">
      <li><a href="/" class="nav-link" data-page="home">Home</a></li>
      <li>
        <a href="/properties/" class="nav-link" data-page="properties"
          >Properties</a
        >
      </li>
      <li>
        <a href="/about-us/" class="nav-link" data-page="about-us">About</a>
      </li>
      <li>
        <a href="/services/" class="nav-link" data-page="services">Services</a>
      </li>
      <li>
        <a href="/projects/" class="nav-link" data-page="projects" style="display: none;">Projects</a>
      </li>
      <li>
        <a
          href="/contact-us/"
          class="nav-link contact-btn"
          data-page="contact-us"
          >Contact</a
        >
      </li>
    </ul>
    <button
      class="hamburger"
      id="hamburger"
      aria-label="Menu"
      aria-expanded="false"
    >
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<div
  class="mobile-menu"
  id="mobileMenu"
  role="dialog"
  aria-label="Mobile navigation"
>
  <ul>
    <li><a href="/" class="mob-link" data-page="home">Home</a></li>
    <li>
      <a href="/properties/" class="mob-link" data-page="properties"
        >Properties</a
      >
    </li>
    <li>
      <a href="/about-us/" class="mob-link" data-page="about-us">About</a>
    </li>
    <li>
      <a href="/services/" class="mob-link" data-page="services">Services</a>
    </li>
    <li>
      <a href="/projects/" class="mob-link" data-page="projects" style="display: none;" >Projects</a>
    </li>
    <li>
      <a href="/contact-us/" class="mob-link" data-page="contact-us">Contact</a>
    </li>
  </ul>
</div>
