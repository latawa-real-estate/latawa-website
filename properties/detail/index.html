<script>
function metaChip(label, value) {
  if (!value) return '';
  return `<span class="pd-meta-chip">${label}: <strong>${value}</strong></span>`;
}

// description comes back as Sanity portable text (array of blocks)
function portableTextToPlain(blocks) {
  if (typeof blocks === 'string') return blocks;
  if (!Array.isArray(blocks)) return '';
  return blocks
    .filter((b) => b._type === 'block' && b.children)
    .map((b) => b.children.map((c) => c.text).join(''))
    .join('\n\n');
}

function pdCardHTML(item) {
  return `<div class="pd-card reveal-up">
    <span class="pd-card-icon">${item.icon || ''}</span>
    <h3 class="pd-card-title">${item.title || ''}</h3>
    <p class="pd-card-text">${item.text || ''}</p>
  </div>`;
}

window.__pageInit = async function() {
  if (!PREFERS_REDUCED) {
    const tl = gsap.timeline({ delay: 0.2 });
    tl.to('.hero-title-line', { y:'0%', opacity:1, duration:0.9, ease:'power4.out', stagger:0.12 })
      .to('.page-hero-sub', { opacity:1, y:0, duration:0.7, ease:'power3.out' }, '-=0.35');
  } else {
    gsap.set('.hero-title-line, .page-hero-sub', { opacity:1, y:0 });
  }

  const params = new URLSearchParams(window.location.search);
  const slug = params.get('slug');
  if (!slug) {
    window.location.replace('/properties/');
    return;
  }

  // Local-only preview path: lets drafts (unpublished Sanity docs) be previewed
  // on localhost before publishing. Inert on the real deployed site.
  const isLocalPreview = ['localhost', '127.0.0.1'].includes(window.location.hostname);
  const previewRequested = params.get('preview') === '1';

  let p;
  if (isLocalPreview && previewRequested) {
    try {
      const res = await fetch(`http://localhost:8787/property?slug=${encodeURIComponent(slug)}`);
      p = await res.json();
    } catch (e) {
      console.warn('[preview] proxy fetch failed, falling back to live CDN', e);
    }
  }
  if (!p) {
    p = await sanityFetch(`*[_type=="property" && slug.current=="${slug}"][0]{
      name,subtitle,description,projectName,configuration,sizeRange,propertyType,idealFor,
      location,price,mainImage,gallery,highlights,amenities,locationBlurb,contactName,contactPhone
    }`);
  }

  if (!p) {
    window.location.replace('/properties/');
    return;
  }

  document.title = `${p.name} | Latawa Real Estate`;
  document.getElementById('pageTitle').textContent = `${p.name} | Latawa Real Estate`;
  const descPlain = portableTextToPlain(p.description);
  if (descPlain) document.getElementById('pageDesc').setAttribute('content', descPlain.slice(0, 160));

  document.getElementById('breadcrumbName').textContent = p.name;
  document.getElementById('pdName').textContent = p.name;
  document.getElementById('pdProjectName').textContent = p.projectName || '';
  document.getElementById('pdSubtitle').textContent = p.subtitle || '';

  const heroImg = p.mainImage ? sanityImg(p.mainImage, 1800, 80) : null;
  if (heroImg) {
    document.getElementById('pageHeroImg').src = heroImg;
    document.getElementById('pageHeroImg').style.display = '';
    document.getElementById('pageHeroPlaceholder').style.display = 'none';
  }

  document.getElementById('pdMetaRow').innerHTML = [
    metaChip('Configuration', p.configuration),
    metaChip('Size', p.sizeRange),
    metaChip('Location', p.location),
    metaChip('Project', p.projectName),
    metaChip('Property Type', p.propertyType),
    metaChip('Ideal For', p.idealFor),
  ].join('');

  document.getElementById('pdDescription').textContent = portableTextToPlain(p.description);

  if (p.highlights && p.highlights.length) {
    document.getElementById('pdHighlightsWrap').innerHTML = `
      <div class="section-header" style="margin-bottom:24px;">
        <p class="section-eyebrow">✨ Why Choose ${p.name}</p>
      </div>
      <div class="pd-grid" style="margin-bottom:56px;">${p.highlights.map(pdCardHTML).join('')}</div>`;
  }

  if (p.amenities && p.amenities.length) {
    document.getElementById('pdAmenitiesWrap').innerHTML = `
      <div class="section-header" style="margin-bottom:24px;">
        <p class="section-eyebrow">🌟 World-Class Amenities</p>
      </div>
      <div class="pd-grid" style="margin-bottom:56px;">${p.amenities.map(pdCardHTML).join('')}</div>`;
  }

  if (p.gallery && p.gallery.length) {
    document.getElementById('pdGalleryWrap').innerHTML = `
      <div class="section-header" style="margin-bottom:24px;">
        <p class="section-eyebrow">📸 Gallery</p>
      </div>
      <div class="pd-gallery" style="margin-bottom:56px;">${p.gallery.map(img => `<img src="${sanityImg(img, 700, 80)}" alt="${p.name}" loading="lazy" />`).join('')}</div>`;
  }

  if (p.locationBlurb) {
    document.getElementById('pdLocationWrap').innerHTML = `
      <div class="section-header" style="margin-bottom:24px;">
        <p class="section-eyebrow">📍 Prime Location</p>
      </div>
      <p class="pd-location-blurb">${p.locationBlurb}</p>`;
  }

  if (p.contactName || p.contactPhone) {
    const caption = document.getElementById('pdContactCaption');
    const who = p.contactName ? `Speak with ${p.contactName}` : 'Speak with us';
    caption.textContent = p.contactPhone ? `${who} — ${p.contactPhone}` : who;
    caption.style.display = '';
  }

  if (p.contactPhone) {
    const digits = p.contactPhone.replace(/[^+\d]/g, '');
    const telHref = 'tel:' + digits;
    document.getElementById('pdCallBtn').href = telHref;
    document.getElementById('pdCallBtn').style.display = '';
    document.getElementById('pdStickyCallBtn').href = telHref;

    const waDigits = digits.replace(/^\+/, '');
    const waMessage = encodeURIComponent(`Hi, I'm interested in ${p.name}. Could you share more details?`);
    const waHref = `https://wa.me/${waDigits}?text=${waMessage}`;
    document.getElementById('pdWhatsappBtn').href = waHref;
    document.getElementById('pdWhatsappBtn').style.display = '';
    document.getElementById('pdStickyWhatsappBtn').href = waHref;

    document.getElementById('pdStickyBar').style.display = 'flex';
  }
};
</script>
